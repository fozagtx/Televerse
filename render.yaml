services:
  - type: web
    name: televerse
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_URL
        value: https://televerse-egjd.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: PYTHON_PATH
        value: /app/.venv/bin/python3
      - key: PROJECT_ROOT
        value: /app
      - key: WORKER_SOCKET_URL
        value: http://127.0.0.1:3000
    healthCheckPath: /
