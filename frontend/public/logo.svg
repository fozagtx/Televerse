<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="portal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.2"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>

  <!-- Outer ring -->
  <ellipse cx="256" cy="256" rx="160" ry="100" fill="none" stroke="url(#ring)" stroke-width="4" transform="rotate(-15, 256, 256)"/>

  <!-- Portal glow -->
  <ellipse cx="256" cy="256" rx="130" ry="80" fill="url(#portal)" opacity="0.15" transform="rotate(-15, 256, 256)"/>

  <!-- Inner portal circle -->
  <ellipse cx="256" cy="256" rx="130" ry="80" fill="none" stroke="url(#portal)" stroke-width="3" transform="rotate(-15, 256, 256)"/>

  <!-- Arrow through portal -->
  <line x1="140" y1="256" x2="340" y2="256" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>
  <polygon points="340,256 310,236 310,276" fill="#a78bfa"/>

  <!-- Small orbit dots -->
  <circle cx="180" cy="180" r="6" fill="#818cf8" opacity="0.8"/>
  <circle cx="340" cy="320" r="4" fill="#a78bfa" opacity="0.6"/>
  <circle cx="150" cy="310" r="3" fill="#6366f1" opacity="0.5"/>
  <circle cx="360" cy="200" r="5" fill="#8b5cf6" opacity="0.7"/>

  <!-- Text -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="4">TELEVERSE</text>
</svg>